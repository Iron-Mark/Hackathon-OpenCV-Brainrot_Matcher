services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - backend-weights:/app/weights

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        API_URL: http://backend:8000
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-weights:
