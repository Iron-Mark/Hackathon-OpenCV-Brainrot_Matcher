services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      BACKEND_API_TOKEN: ${BACKEND_API_TOKEN:?set BACKEND_API_TOKEN to at least 32 random characters}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend-weights:/app/weights

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        API_URL: http://backend:8000
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-weights:
