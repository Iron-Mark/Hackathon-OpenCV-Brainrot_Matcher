name: Assemble gallery-feat

on:
  push:
    branches:
      - agent/zero-cost-matcher-1525
    paths:
      - frontend/public/assets/gallery-feat-parts/**
      - .github/workflows/assemble-gallery-feat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact fingerprints
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          parts = pathlib.Path("frontend/public/assets/gallery-feat-parts")
          dest = pathlib.Path("frontend/public/assets/gallery-feat.json")
          items = list(json.loads(dest.read_text())["items"][:4])
          for i in range(5, 18):
              items.append(json.loads((parts / f"{i:02d}.json").read_text()))
          out = json.dumps({"version": 3, "items": items}, separators=(",", ":"))
          raw = out.encode()
          blob = hashlib.sha1(b"blob %d\0" % len(raw) + raw).hexdigest()
          expected = "4d40342503c9cffec052b1327a35f8d178586182"
          if blob != expected:
              raise SystemExit(f"blob mismatch {blob} != {expected}")
          dest.write_bytes(raw)
          print(blob, len(raw))
          PY
      - name: Commit assembled file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/assets/gallery-feat.json
          git diff --cached --quiet && echo unchanged && exit 0
          git commit -m "Commit precomputed roster fingerprints"
          git push
